name: Collect Chungnam notices

on:
  schedule:
    # 09:00–21:00 KST, every 2 hours. GitHub schedules use UTC.
    - cron: '0 0,2,4,6,8,10,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chungnam-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      CHUNGNAM_PUBLIC_JSON: ${{ github.workspace }}/chungnam_support_data.json
      CHUNGNAM_NOTICES_JSON: ${{ github.workspace }}/chungnam_support_notices.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python collect_public.py --force
      - name: Publish notice list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chungnam_support_notices.json
          if git diff --cached --quiet; then
            echo "Notice list is unchanged."
          else
            git commit -m "Update the collected notice list."
            git push
          fi
