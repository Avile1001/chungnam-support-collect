name: Collect Chungnam notices

on:
  schedule:
    # 09:00–21:00 KST, every 2 hours. GitHub schedules use UTC.
    - cron: '0 0,2,4,6,8,10,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chungnam-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      CHUNGNAM_PUBLIC_JSON: ${{ github.workspace }}/chungnam_support_data.json
      CHUNGNAM_NOTICES_JSON: ${{ github.workspace }}/chungnam_support_notices.json
      CAFE24_FTP_HOST: ${{ secrets.CAFE24_FTP_HOST }}
      CAFE24_FTP_USER: ${{ secrets.CAFE24_FTP_USER }}
      CAFE24_FTP_PASSWORD: ${{ secrets.CAFE24_FTP_PASSWORD }}
      CAFE24_FTP_DIR: ${{ secrets.CAFE24_FTP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python collect_public.py --force
      - uses: actions/upload-artifact@v4
        with:
          name: chungnam-support-notices
          path: chungnam_support_notices.json
          if-no-files-found: error
      - run: python upload_notices.py
